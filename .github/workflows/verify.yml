name: Verify

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Node 24 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run quality:check
      - run: npm run build
      - run: npm test
      - run: npm run test:platform
      - run: npm run benchmark:ci
      - run: git diff --check
      - run: npm audit --omit=dev
      - run: npm audit

  extension-host-e2e:
    name: Extension Host E2E / VS Code ${{ matrix.vscode-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        vscode-version: ['1.90.0', stable]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: xvfb-run -a npm run test:e2e
        env:
          VSCODE_E2E_VERSION: ${{ matrix.vscode-version }}
